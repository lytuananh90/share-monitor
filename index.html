<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareMonitor - Máy Chiếu Cửa Sổ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    #top-hover-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 30px;
      z-index: 20;
    }

    #controls {
      position: fixed;
      top: 15px;
      z-index: 30;
      background: rgba(20, 20, 24, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      padding: 6px 14px;
      border-radius: 30px;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      transform: translateY(0);
      opacity: 1;
    }

    #controls.hidden {
      transform: translateY(-80px);
      opacity: 0;
      pointer-events: none;
    }

    .btn {
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: 20px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #3b82f6;
    }
    .btn-switch {
      background: rgba(245, 158, 11, 0.85);
      color: white;
      display: none;
      padding: 5px 12px;
      font-size: 12px;
    }
    .btn-switch:hover {
      background: #f59e0b;
    }
    .btn-stop {
      background: rgba(220, 38, 38, 0.85);
      color: white;
      display: none;
      padding: 5px 12px;
      font-size: 12px;
    }
    .btn-stop:hover {
      background: #dc2626;
    }
    .btn-pip {
      background: rgba(16, 185, 129, 0.85);
      color: white;
      display: none;
      padding: 5px 12px;
      font-size: 12px;
    }
    .btn-pip:hover {
      background: #10b981;
    }
    .btn-icon {
      background: rgba(255, 255, 255, 0.1);
      color: #e4e4e7;
      padding: 5px 10px;
      font-size: 12px;
    }
    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .hint {
      font-size: 11px;
      color: #a1a1aa;
    }

    /* Màn hình chiếu chính (Canvas) */
    #viewCanvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
      cursor: pointer;
      display: block;
    }

    #hiddenVideo {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 160px;
      height: 90px;
      opacity: 0.001;
      pointer-events: none;
      z-index: -1;
    }

    #empty-state {
      position: absolute;
      text-align: center;
      color: #71717a;
      pointer-events: none;
      z-index: 10;
    }
    #empty-state svg {
      width: 60px;
      height: 60px;
      margin-bottom: 12px;
      opacity: 0.4;
    }
    #empty-state p {
      font-size: 14px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div id="top-hover-zone"></div>

  <div id="controls">
    <button id="startBtn" class="btn btn-primary">
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M4 6h16v10H4V6zm18-2H2c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/></svg>
      Chọn Cửa Sổ Chiếu
    </button>
    <button id="switchBtn" class="btn btn-switch" title="Đổi sang cửa sổ hoặc màn hình khác (S)">
      🔄 Đổi Nguồn Chiếu
    </button>
    <button id="pipBtn" class="btn btn-pip" title="Thu nhỏ góc màn hình chính để giám sát (P)">
      📺 Giám Sát Góc (PiP)
    </button>
    <button id="stopBtn" class="btn btn-stop">
      ⏹ Dừng Chiếu
    </button>
    <button id="fsBtn" class="btn btn-icon" title="Toàn màn hình (F)">⛶ Toàn Màn Hình</button>
    <span id="hintText" class="hint">(Phím F: Fullscreen | P: Màn hình góc PiP)</span>
  </div>

  <div id="empty-state">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h14v3H5z"/></svg>
    <p>Bấm nút trên để bắt đầu chiếu cửa sổ</p>
  </div>

  <canvas id="viewCanvas"></canvas>
  <video id="hiddenVideo" autoplay playsinline muted></video>

  <script>
    const startBtn = document.getElementById('startBtn');
    const switchBtn = document.getElementById('switchBtn');
    const stopBtn = document.getElementById('stopBtn');
    const pipBtn = document.getElementById('pipBtn');
    const fsBtn = document.getElementById('fsBtn');
    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const video = document.getElementById('hiddenVideo');
    const controls = document.getElementById('controls');
    const emptyState = document.getElementById('empty-state');
    const topHoverZone = document.getElementById('top-hover-zone');
    const hintText = document.getElementById('hintText');
    let currentStream = null;
    let autoHideTimer = null;
    let animId = null;
    let pipWindow = null;

    function renderLoop() {
      if (video.readyState >= 2 && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      animId = requestAnimationFrame(renderLoop);
    }

    function showControlsBriefly(ms = 3000) {
      clearTimeout(autoHideTimer);
      controls.classList.remove('hidden');
      if (currentStream && ms > 0) {
        autoHideTimer = setTimeout(() => {
          controls.classList.add('hidden');
        }, ms);
      }
    }

    function toggleControls() {
      if (!currentStream) return;
      if (controls.classList.contains('hidden')) {
        showControlsBriefly(3000);
      } else {
        clearTimeout(autoHideTimer);
        controls.classList.add('hidden');
      }
    }

    async function startCapture() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            width: { ideal: 3840, max: 3840 },
            height: { ideal: 2160, max: 2160 },
            frameRate: { ideal: 60, max: 60 },
            cursor: "always"
          },
          audio: false
        });

        const track = stream.getVideoTracks()[0];
        if (track && 'contentHint' in track) {
          track.contentHint = 'text';
        }

        // Dọn luồng cũ nếu có
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }

        currentStream = stream;
        video.srcObject = stream;
        await video.play();

        emptyState.style.display = 'none';
        startBtn.style.display = 'none';
        switchBtn.style.display = 'inline-flex';
        stopBtn.style.display = 'inline-flex';
        pipBtn.style.display = 'inline-flex';
        hintText.style.display = 'none';

        cancelAnimationFrame(animId);
        renderLoop();

        showControlsBriefly(1500);

        track.onended = () => {
          stopCapture();
        };
      } catch (err) {
        console.warn("Huỷ chọn hoặc lỗi:", err);
      }
    }

    function stopCapture() {
      cancelAnimationFrame(animId);
      if (pipWindow && !pipWindow.closed) {
        pipWindow.close();
        pipWindow = null;
      } else if (document.pictureInPictureElement) {
        document.exitPictureInPicture().catch(() => {});
      }
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      emptyState.style.display = 'block';
      startBtn.style.display = 'inline-flex';
      switchBtn.style.display = 'none';
      stopBtn.style.display = 'none';
      pipBtn.style.display = 'none';
      hintText.style.display = 'inline';
      clearTimeout(autoHideTimer);
      controls.classList.remove('hidden');
    }

    // Mở cửa sổ nhỏ PiP có sẵn nút Đổi Nguồn Chiếu ngay bên trong
    async function togglePiP() {
      if (!currentStream) return;

      // Ưu tiên Document Picture-in-Picture API (Chrome 116+) có UI điều khiển
      if ('documentPictureInPicture' in window) {
        try {
          if (pipWindow && !pipWindow.closed) {
            pipWindow.close();
            pipWindow = null;
            return;
          }

          pipWindow = await window.documentPictureInPicture.requestWindow({
            width: 380,
            height: 250
          });

          pipWindow.document.body.innerHTML = `
            <style>
              * { margin:0; padding:0; box-sizing:border-box; }
              body { background:#0a0a0c; color:#fff; font-family:system-ui,sans-serif; overflow:hidden; display:flex; flex-direction:column; height:100vh; }
              .header { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:rgba(24,24,27,0.95); border-bottom:1px solid rgba(255,255,255,0.1); z-index:10; }
              .title { font-size:11px; font-weight:600; color:#a1a1aa; }
              .btn-switch { background:#f59e0b; color:#fff; border:none; padding:4px 10px; border-radius:12px; font-size:11px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:4px; }
              .btn-switch:hover { background:#d97706; }
              .btn-stop { background:#dc2626; color:#fff; border:none; padding:4px 8px; border-radius:12px; font-size:11px; font-weight:600; cursor:pointer; }
              .btn-stop:hover { background:#b91c1c; }
              .video-box { flex:1; display:flex; align-items:center; justify-content:center; background:#000; position:relative; }
              canvas { width:100%; height:100%; object-fit:contain; }
            </style>
            <div class="header">
              <span class="title">📺 Giám Sát Màn Hình Phụ</span>
              <div style="display:flex; gap:6px;">
                <button id="pipSwitchBtn" class="btn-switch">🔄 Đổi Nguồn</button>
                <button id="pipStopBtn" class="btn-stop">⏹</button>
              </div>
            </div>
            <div class="video-box">
              <canvas id="pipCanvas"></canvas>
            </div>
          `;

          const pipCanvas = pipWindow.document.getElementById('pipCanvas');
          const pipCtx = pipCanvas.getContext('2d', { alpha: false });
          const pipSwitchBtn = pipWindow.document.getElementById('pipSwitchBtn');
          const pipStopBtn = pipWindow.document.getElementById('pipStopBtn');

          function renderPip() {
            if (!pipWindow || pipWindow.closed) return;
            if (video.readyState >= 2 && video.videoWidth > 0) {
              if (pipCanvas.width !== video.videoWidth || pipCanvas.height !== video.videoHeight) {
                pipCanvas.width = video.videoWidth;
                pipCanvas.height = video.videoHeight;
              }
              pipCtx.drawImage(video, 0, 0, pipCanvas.width, pipCanvas.height);
            }
            pipWindow.requestAnimationFrame(renderPip);
          }
          renderPip();

          pipSwitchBtn.onclick = () => {
            startCapture();
          };
          pipStopBtn.onclick = () => {
            stopCapture();
          };

          pipWindow.addEventListener('pagehide', () => {
            pipWindow = null;
          });
          return;
        } catch (err) {
          console.warn("Doc PiP fallback sang standard PiP:", err);
        }
      }

      // Fallback: Standard HTML5 Video PiP
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.warn("Lỗi Picture-in-Picture:", err);
      }
    }

    startBtn.onclick = startCapture;
    switchBtn.onclick = startCapture;
    stopBtn.onclick = stopCapture;
    pipBtn.onclick = togglePiP;

    // 1. Click vào màn hình canvas -> Bật/Tắt thanh điều khiển
    let clickTimeout = null;
    canvas.onclick = (e) => {
      if (clickTimeout) return;
      clickTimeout = setTimeout(() => {
        toggleControls();
        clickTimeout = null;
      }, 250);
    };

    // 2. Đúp chuột (Double Click) -> Bật/Tắt Fullscreen
    const toggleFullscreen = () => {
      clearTimeout(clickTimeout);
      clickTimeout = null;
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };
    canvas.ondblclick = toggleFullscreen;
    fsBtn.onclick = toggleFullscreen;

    // 3. Rê chuột lên sát mép trên cùng (Top zone) -> Hiện thanh điều khiển
    topHoverZone.onmouseenter = () => {
      if (currentStream) showControlsBriefly(3000);
    };
    controls.onmouseenter = () => {
      clearTimeout(autoHideTimer);
    };
    controls.onmouseleave = () => {
      if (currentStream) showControlsBriefly(1500);
    };

    // Phím tắt
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 'p' || e.key === 'P') togglePiP();
      if (e.key === 's' || e.key === 'S') startCapture();
      if (e.key === ' ') {
        e.preventDefault();
        toggleControls();
      }
      if (e.key === 'Escape' && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
